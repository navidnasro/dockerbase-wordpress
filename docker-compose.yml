services:

  nginx:
    image: nginx:alpine
    container_name: stock_wp_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/logs/nginx:/var/log/nginx
      - wordpress_core:/var/www/html:ro
      - ./content/plugins:/var/www/html/wp-content/plugins:ro
      - ./content/themes:/var/www/html/wp-content/themes:ro
      - wp_uploads:/var/www/html/wp-content/uploads:ro
      - ./docker/config/php/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - stock_wp_net

  php:
    image: wordpress:php8.3-fpm-alpine        
    container_name: stock_wp_php
    restart: unless-stopped
    volumes:
      - wordpress_core:/var/www/html
      - ./content/plugins:/var/www/html/wp-content/plugins
      - ./content/themes:/var/www/html/wp-content/themes
      - wp_uploads:/var/www/html/wp-content/uploads
      - ./docker/logs/php:/var/log/php
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX}
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME',    '${WP_HOME:-http://localhost:8080}');
        define('WP_SITEURL', '${WP_SITEURL:-http://localhost:8080}');
        define('WPLANG',     '${WPLANG:-fa_IR}');
        define('WP_POST_REVISIONS', ${WP_POST_REVISIONS:-5});
        define('AUTOSAVE_INTERVAL', ${AUTOSAVE_INTERVAL:-120});
        define('WP_MEMORY_LIMIT',   '${WP_MEMORY_LIMIT:-256M}');
        define('DISALLOW_FILE_EDIT', ${DISALLOW_FILE_EDIT:-true});
        define('WP_DEBUG_LOG',     ${WP_DEBUG_LOG:-true});
        define('WP_DEBUG_DISPLAY', ${WP_DEBUG_DISPLAY:-false});
        @ini_set('display_errors', 0);
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "9000"
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t 2>&1 | grep -q 'successful' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - stock_wp_net

  mysql:
    image: mysql:9.0                         
    container_name: stock_wp_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ALLOW_EMPTY_PASSWORD: ${MYSQL_ALLOW_EMPTY_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "root", "--password=${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - stock_wp_net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: stock_wp_phpmyadmin
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - stock_wp_net

networks:
  stock_wp_net:
    driver: bridge
    name: stock_wp_net

volumes:
  wordpress_core:
    name: stock_wp_core
  wp_uploads:
    name: stock_wp_uploads
  mysql_data:
    name: stock_wp_mysql_data