# nginx/conf.d/default.conf

# ── Hide Nginx version from response headers ──
# نمایش‌ندادن نسخه Nginx در هدرها
# Reduces attacker reconnaissance surface in production.
server_tokens off;

# ── PHP-FPM upstream pool ──
# تعریف upstream برای PHP-FPM
# Abstracts the backend address; enables load balancing or failover
# with a single-line change.
upstream stock_php_fpm {
    # Docker's internal DNS resolves the service name at runtime.
    server php:9000;
}

server {
    listen 80;
    server_name stock-plugin.com;
    root /var/www/html;
    index index.php index.html;

    # UTF-8 encoding — required for correct Persian rendering.
    charset utf-8;

    # Must match upload_max_filesize and post_max_size in php.ini.
    client_max_body_size 64M;

    # ════════════════════════════════════════
    # Security Headers
    # هدرهای امنیتی
    # Instructs browsers on content handling policy.
    # ════════════════════════════════════════

    # Prevent the page from being embedded in a foreign iframe (clickjacking).
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Disable MIME-type sniffing; browser must respect the declared Content-Type.
    add_header X-Content-Type-Options "nosniff" always;

    # Legacy XSS auditor — harmless on modern browsers, still useful for older ones.
    add_header X-XSS-Protection "1; mode=block" always;

    # Send full origin on same-origin requests; send only the origin on cross-origin.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Revoke access to sensitive browser APIs not used by this application.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # CSP is omitted intentionally: WordPress requires inline scripts and styles.
    # Define a policy incrementally using a report-only header first, then enforce.
    # add_header Content-Security-Policy "..." always;

    # ════════════════════════════════════════
    # Sensitive Path Restrictions
    # محدودیت دسترسی به مسیرهای حساس
    # ════════════════════════════════════════

    # .htaccess is an Apache construct and must never be served by Nginx.
    location ~ /\.ht {
        deny all;
    }

    # Block access to VCS metadata and environment files.
    location ~ /\.(env|git|svn|hg) {
        deny all;
    }

    # wp-config.php contains credentials; direct HTTP access must never be allowed.
    location = /wp-config.php {
        deny all;
    }

    # xmlrpc.php is a legacy XML-RPC endpoint; a common brute-force and DDoS vector.
    # Remove this rule only if a plugin explicitly requires XML-RPC.
    location = /xmlrpc.php {
        deny all;
    }

    # Prevent PHP execution inside the uploads directory.
    # Even if an attacker uploads a .php file, Nginx will not forward it to FPM.
    location ~* /wp-content/uploads/.*\.php$ {
        deny all;
    }

    # Deny common backup, editor-swap, and build-artifact files.
    location ~* \.(bak|conf|dist|fla|inc|ini|log|psd|sh|sql|swp)$ {
        deny all;
    }

    # ════════════════════════════════════════
    # Health Check
    # بررسی سلامت سرویس
    # Used by the Docker HEALTHCHECK directive.
    # ════════════════════════════════════════
    location = /ping {
        access_log off;
        return 200 "pong\n";
        add_header Content-Type text/plain;
    }

    # ════════════════════════════════════════
    # Static Asset Serving
    # سرو مستقیم فایل‌های استاتیک توسط Nginx
    # Served directly by Nginx — PHP is never involved.
    # ════════════════════════════════════════
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        # 1-year cache lifetime, combined with content-hash filenames in production.
        expires 1y;

        # `immutable` tells the browser to skip revalidation until the URL changes.
        add_header Cache-Control "public, immutable";

        # Static file requests account for the majority of traffic; logging them adds
        # noise and disk I/O with no diagnostic value.
        access_log off;

        # Return 404 for missing assets; never fall through to the PHP router.
        try_files $uri =404;
    }

    # ════════════════════════════════════════
    # WordPress Front Controller
    # روتر اصلی وردپرس
    # ════════════════════════════════════════
    location / {
        # 1. Serve the exact file if it exists.
        # 2. Serve the directory if it exists.
        # 3. Hand the request to the WordPress router, preserving the query string.
        try_files $uri $uri/ /index.php?$args;
    }

    # ════════════════════════════════════════
    # PHP-FPM Handler
    # پردازش فایل‌های PHP از طریق PHP-FPM
    # ════════════════════════════════════════
    location ~ \.php$ {
        # Reject requests for non-existent PHP files before they reach FPM.
        # Prevents Nginx from forwarding crafted path-info payloads.
        try_files $uri =404;

        # Splits the URI into SCRIPT_FILENAME and PATH_INFO components.
        # Required by some WordPress plugins that rely on PATH_INFO routing.
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        fastcgi_pass stock_php_fpm;
        fastcgi_index index.php;

        # Standard FastCGI parameter set (SERVER_*, HTTP_*, etc.).
        include fastcgi_params;

        # Absolute path of the script to execute; FPM requires this explicitly.
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;

        # Allow up to 300 s for long-running operations such as WP-CLI imports
        # or large plugin activations.
        fastcgi_read_timeout 300;

        # Buffer the FPM response in memory before sending to the client.
        # Sizing too small forces buffering to disk, increasing latency.
        fastcgi_buffer_size 128k;
        fastcgi_buffers     4 256k;

        # Restrict to methods used by WordPress core and the REST API.
        # Remove or extend if the application relies on PUT, PATCH, or DELETE.
        limit_except GET POST {
            deny all;
        }
    }

    # ════════════════════════════════════════
    # Logging
    # لاگ‌های دسترسی و خطا
    # ════════════════════════════════════════

    # Records every request; useful for traffic analysis and debugging.
    access_log /var/log/nginx/access.log;

    # `warn` suppresses debug/info noise; switch to `debug` during local development.
    error_log /var/log/nginx/error.log warn;
}
